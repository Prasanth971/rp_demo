name: 'Terraform Automation'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select the Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - validate
          - plan
          - apply

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform Action Execution'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./

    steps:
    # 1. Pull down the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Authenticate to AWS using GitHub Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    # 3. Set up the Terraform binary on the GitHub runner
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.0

    # 4. Initialize Terraform (Required before running validate, plan, or apply)
    - name: Terraform Init
      run: terraform init

    # 5. Run Validate if selected in the dropdown
    - name: Terraform Validate
      if: ${{ inputs.action == 'validate' }}
      run: terraform validate -no-color

    # 6. Run Plan if selected in the dropdown
    - name: Terraform Plan
      if: ${{ inputs.action == 'plan' }}
      run: terraform plan -no-color

    # 7. Run Apply if selected in the dropdown
    - name: Terraform Apply
      if: ${{ inputs.action == 'apply' }}
      run: terraform apply -auto-approve