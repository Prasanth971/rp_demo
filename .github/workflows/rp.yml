name: 'Terraform Automation'

on:
  workflow_dispatch: # A simple click-to-run button with no dropdown selections required

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform Validate, Plan, and Apply'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./

    steps:
    # 1. Pull down the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Authenticate to AWS using GitHub Secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    # 3. Set up the Terraform binary on the GitHub runner
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.0

    # 4. Initialize Terraform (Required for all subsequent steps)
    - name: Terraform Init
      run: terraform init

    # 5. Automatically Validate code syntax
    - name: Terraform Validate
      run: terraform validate -no-color

    # 6. Automatically generate execution Plan
    - name: Terraform Plan
      run: terraform plan -no-color

    # 7. Automatically Apply changes to Amazon Connect
    - name: Terraform Apply
      run: terraform apply -auto-approve
